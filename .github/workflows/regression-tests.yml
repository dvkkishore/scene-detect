name: Pose classifier tests
on:
  push:
    branches: ["fix/pose-classification-and-demo-claims-20261015"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install numpy
      - name: Run focused regression tests
        run: |
          python -m unittest discover -s tests -v
          python detection_with_images.py --help > /dev/null
          python -m compileall -q detection_with_images.py pose_classifier.py
